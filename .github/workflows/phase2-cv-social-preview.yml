name: Prepare CV social preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/phase2-cv-social-preview.yml"
      - "index.html"
      - "test/interface-shell.test.mjs"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-phase2-cv-social-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/cv-social-preview-card'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prove the central CV card is live
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://atlas-systems.uk/og/cv.png \
            --output "${RUNNER_TEMP}/cv.png"
          CARD_PATH="${RUNNER_TEMP}/cv.png" python3 - <<'PY'
          import os
          import struct
          from pathlib import Path
          data = Path(os.environ["CARD_PATH"]).read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("CV card is not a PNG")
          if struct.unpack(">II", data[16:24]) != (1200, 630):
              raise SystemExit("CV card is not 1200x630")
          PY

      - name: Verify merged satellite metadata on production domains
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/satellite-html"
          for attempt in $(seq 1 18)
          do
            status_ok=0
            ramone_ok=0
            api_ok=0

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://status.atlas-systems.uk/?social-check=${attempt}" \
              --output "${RUNNER_TEMP}/satellite-html/status.html"
            then
              grep -Fq 'https://atlas-systems.uk/og/status.png' "${RUNNER_TEMP}/satellite-html/status.html" && status_ok=1
            fi

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://ramone.atlas-systems.uk/?social-check=${attempt}" \
              --output "${RUNNER_TEMP}/satellite-html/ramone.html"
            then
              grep -Fq 'https://atlas-systems.uk/og/ramone.png' "${RUNNER_TEMP}/satellite-html/ramone.html" && ramone_ok=1
            fi

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://api.atlas-systems.uk/v1/docs?social-check=${attempt}" \
              --output "${RUNNER_TEMP}/satellite-html/api-docs.html"
            then
              grep -Fq 'https://atlas-systems.uk/og/api-docs.png' "${RUNNER_TEMP}/satellite-html/api-docs.html" && api_ok=1
            fi

            if [ "${status_ok}" -eq 1 ] && [ "${ramone_ok}" -eq 1 ] && [ "${api_ok}" -eq 1 ]
            then
              break
            fi

            if [ "${attempt}" -eq 18 ]
            then
              echo "Production satellite metadata did not converge in time" >&2
              exit 1
            fi
            sleep 10
          done

          SATELLITE_ROOT="${RUNNER_TEMP}/satellite-html" python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["SATELLITE_ROOT"])
          contracts = {
              "status.html": (
                  "https://atlas-systems.uk/og/status.png",
                  "Live estate status. // Atlas Systems",
              ),
              "ramone.html": (
                  "https://atlas-systems.uk/og/ramone.png",
                  "Ramone. Local AI, self-hosted. // Atlas Systems",
              ),
              "api-docs.html": (
                  "https://atlas-systems.uk/og/api-docs.png",
                  "The Atlas Systems API. // Atlas Systems",
              ),
          }
          for filename, (image, alt) in contracts.items():
              html = (root / filename).read_text(encoding="utf-8")
              for expected in (
                  f'property="og:image" content="{image}"',
                  f'name="twitter:image" content="{image}"',
                  f'property="og:image:alt" content="{alt}"',
                  f'name="twitter:image:alt" content="{alt}"',
              ):
                  if expected not in html:
                      raise SystemExit(f"{filename} missing {expected}")
              print(f"verified production metadata: {filename}")
          PY

      - name: Materialize CV metadata and tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          old_card = "https://atlas-systems.uk/og-default.png"
          new_card = "https://atlas-systems.uk/og/cv.png"
          if html.count(old_card) == 2:
              html = html.replace(old_card, new_card)
          elif html.count(new_card) != 2:
              raise SystemExit("unexpected CV social-card references")
          old_alt = '<meta property="og:image:alt" content="Atlas Systems: audio systems, local AI infrastructure, and deployment automation">'
          new_alt = '<meta property="og:image:alt" content="Atlas Reaper: engineering CV. // Atlas Systems">'
          if old_alt in html:
              html = html.replace(old_alt, new_alt)
          elif new_alt not in html:
              raise SystemExit("unexpected CV Open Graph alt tag")
          twitter_image = f'<meta name="twitter:image" content="{new_card}">'
          twitter_alt = '<meta name="twitter:image:alt" content="Atlas Reaper: engineering CV. // Atlas Systems">'
          if twitter_alt not in html:
              if html.count(twitter_image) != 1:
                  raise SystemExit("expected one CV Twitter image tag")
              html = html.replace(twitter_image, f"{twitter_image}\n  {twitter_alt}")
          index.write_text(html, encoding="utf-8")

          tests = Path("test/interface-shell.test.mjs")
          suite = tests.read_text(encoding="utf-8")
          anchor = '  assert.match(\n    html,\n    /<link rel="canonical" href="https:\\/\\/cv\\.atlas-systems\\.uk\\/">/,\n  );\n'
          addition = '''  assert.match(html, /property="og:image" content="https:\\/\\/atlas-systems\\.uk\\/og\\/cv\\.png"/);\n  assert.match(html, /name="twitter:image" content="https:\\/\\/atlas-systems\\.uk\\/og\\/cv\\.png"/);\n  assert.match(html, /property="og:image:alt" content="Atlas Reaper: engineering CV\\. \\/\\/ Atlas Systems"/);\n  assert.match(html, /name="twitter:image:alt" content="Atlas Reaper: engineering CV\\. \\/\\/ Atlas Systems"/);\n'''
          if addition not in suite:
              if suite.count(anchor) != 1:
                  raise SystemExit("could not locate CV metadata test anchor")
              suite = suite.replace(anchor, anchor + addition)
          tests.write_text(suite, encoding="utf-8")
          PY

      - name: Validate generated source
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 index.html
          node scripts/verify-interface-bundle.mjs
          node scripts/verify-pdf-contract.mjs
          node --test test/*.test.mjs
          git diff --check

      - name: Commit generated HTML and tests
        run: |
          set -euo pipefail
          git add index.html test/interface-shell.test.mjs
          if git diff --cached --quiet
          then
            echo "CV metadata is already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use the CV social preview card"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
