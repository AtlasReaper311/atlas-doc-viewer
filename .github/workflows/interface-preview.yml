name: Public interface preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/interface-preview.yml"
      - ".github/workflows/ci.yml"
      - "README.md"
      - "Atlas_Reaper_System_Architect.pdf"
      - "assets/interface/**"
      - "css/cv.css"
      - "css/phase-6-footer.css"
      - "docs/PHASE-F-DOCUMENT-VIEWER-INTERFACE-V2.md"
      - "docs/PHASE-3-COMPARABLE-EVIDENCE.md"
      - "index.html"
      - "js/estate-search.js"
      - "js/estate-status.js"
      - "js/interface-shell.js"
      - "js/viewer.js"
      - "scripts/capture-interface-evidence.mjs"
      - "scripts/capture-comparable-interface-evidence.mjs"
      - "scripts/verify-interface-bundle.mjs"
      - "scripts/verify-pdf-contract.mjs"
      - "site.webmanifest"
      - "test/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-public-interface-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate document viewer candidate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - name: Verify pinned interface and protected PDF
        run: |
          set -euo pipefail
          node scripts/verify-interface-bundle.mjs
          node scripts/verify-pdf-contract.mjs

      - name: Validate HTML, JavaScript, and interface tests
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 index.html
          node --check js/estate-search.js
          node --check js/estate-status.js
          node --check js/interface-shell.js
          node --check js/viewer.js
          node --check scripts/capture-interface-evidence.mjs
          node --check scripts/capture-comparable-interface-evidence.mjs
          node --check scripts/verify-interface-bundle.mjs
          node --check scripts/verify-pdf-contract.mjs
          node --test test/*.test.mjs
          git diff --check

      - name: Validate browser icons
        run: |
          set -euo pipefail
          for path in \
            favicon.ico \
            favicon-16x16.png \
            favicon-32x32.png \
            apple-touch-icon.png \
            android-chrome-192x192.png \
            android-chrome-512x512.png \
            site.webmanifest
          do
            test -s "${path}"
          done

      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          fail: true

      - name: Guard production boundary
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${SOURCE_BRANCH}" != "main"
          test "${SOURCE_BRANCH}" != "production"

  deploy-preview:
    name: Publish isolated document preview
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'interface-preview-approved')
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: public-interface-preview
      url: ${{ steps.deploy.outputs.preview_url }}
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME: atlas-doc-viewer
      PAGES_BRANCH: interface-v2-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Guard isolated Pages target
        run: |
          set -euo pipefail
          test "${PAGES_BRANCH}" = "interface-v2-pr-${{ github.event.pull_request.number }}"
          test "${PAGES_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "production"

      - name: Publish non-production Pages preview
        id: deploy
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4 pages deploy . \
            --project-name "${PROJECT_NAME}" \
            --branch "${PAGES_BRANCH}" \
            --commit-dirty=true 2>&1 | tee "${output_file}"
          preview_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${preview_url}"
          echo "preview_url=${preview_url}" >> "${GITHUB_OUTPUT}"

      - name: Attach preview to the draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          marker="<!-- atlas-public-interface-preview -->"
          body="${marker}
          ## Live interface preview

          - Preview: ${PREVIEW_URL}
          - Commit: \`${{ github.event.pull_request.head.sha }}\`
          - Production: unchanged

          The preview is an isolated Cloudflare Pages branch. Product-specific and comparable evidence use this exact deployment. The production route, Pages project configuration, indexing policy, and protected PDF bytes are unchanged."
          existing_id="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="${body}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi

  capture-evidence:
    name: Capture document viewer browser evidence
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCT_ID: atlas-doc-viewer
    steps:
      - name: Check out exact evidence runners
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            scripts/capture-interface-evidence.mjs
            scripts/capture-comparable-interface-evidence.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - name: Install pinned browser and accessibility tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/document-viewer-evidence"
          cp scripts/capture-interface-evidence.mjs "${RUNNER_TEMP}/document-viewer-evidence/"
          cp scripts/capture-comparable-interface-evidence.mjs "${RUNNER_TEMP}/document-viewer-evidence/"
          cd "${RUNNER_TEMP}/document-viewer-evidence"
          npm init -y >/dev/null
          npm install --save-exact playwright@1.61.1 @axe-core/playwright@4.12.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium firefox

      - name: Capture product-specific Chrome and Firefox matrix
        working-directory: ${{ runner.temp }}/document-viewer-evidence
        run: node capture-interface-evidence.mjs

      - name: Capture comparable cross-product evidence
        working-directory: ${{ runner.temp }}/document-viewer-evidence
        run: node capture-comparable-interface-evidence.mjs

      - name: Upload exact-SHA interface evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: document-viewer-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/document-viewer-evidence/evidence.json
            ${{ runner.temp }}/document-viewer-evidence/capture-error.txt
            ${{ runner.temp }}/document-viewer-evidence/screenshots/*.png
            ${{ runner.temp }}/document-viewer-evidence/comparable-evidence.json
            ${{ runner.temp }}/document-viewer-evidence/comparable-capture-error.txt
            ${{ runner.temp }}/document-viewer-evidence/comparable-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
